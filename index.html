function component(width, height, color, x, y, tileX, tileY) {
    this.width = width;
    this.height = height;
    this.speedX = 0;
    this.speedY = 0;
    this.x = x;
    this.y = y;
	this.color = color;

	this.sides = [x, x + width];
    this.tops = [tileY, tileY + this.height];

    this.leftSide = {
      x: this.x,
      y: this.sides
    };

    this.rightSide = {
      x: this.x + this.width,
      y: this.sides
    };

    this.topSide = {
      x: this.tops,
      y: this.y
    };

    this.bottomSide = {
      x: this.tops,
      y: this.y + this.height
	};


    this.update = function() {
        ctx = myGameArea.context;
        ctx.fillStyle = color;
        ctx.fillRect(this.x, this.y, this.width, this.height);
    }
    this.newPos = function() {
        this.x += this.speedX;
        this.y += this.speedY;
    }    

}

function getRandomInt(min, max) {
    min = Math.ceil(min);
    max = Math.floor(max);
    return Math.floor(Math.random() * (max - min + 1)) + min;
}

function getCell(row, col) {
  var r = Map[row];
  if ( r === undefined ) {
    console.error('Row not found', row, col);
    return null;
  }

  var c = r[col];
  if ( c === undefined ) {
    console.error('Col not found', row, col);
  }

  return c;
}

function updateGameArea() {
    myGameArea.clear();
    myGamePiece.newPos();
    myGamePiece.update();
	
	myGamePiece.speedY += 0.01; //0.035

	if (myGamePiece.speedY < -maxSpeed) {
		myGamePiece.speedY = -maxSpeed
	}
	if (myGamePiece.speedX < -maxSpeed) {
		myGamePiece.speedX = -maxSpeed
	}
	if (myGamePiece.speedY > maxSpeed) {
		myGamePiece.speedY = maxSpeed
	}
	if (myGamePiece.speedX > maxSpeed) {
		myGamePiece.speedX = maxSpeed
	}
	
	tileX = Math.round(this.x / 14);
	tileY = Math.round(this.y / 14);


	//Water
	if ( Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 8) {
		myGamePiece.speedY -= 0.02;
		
		if (inWater != 1 && myGamePiece.speedY > 0.2) {
			var audio = new Audio('Water.mp3');
			maxSpeed = 1;
		audio.play();
		}
		inWater = 1;
	}
	if (inWater == 1 && Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 0) {
		
			myGamePiece.speedY = myGamePiece.speedY / 2.5;
			myGamePiece.speedX = myGamePiece.speedX / 2.5;
		
		
		maxSpeed = 2;
		inWater = 0;
	}

	//Safe
	if ( Map[Math.floor((myGamePiece.y + rocketHeight) / 14)][Math.floor(myGamePiece.x / 14)] == 6 && Map[Math.floor((myGamePiece.y + rocketHeight) / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 6) {

		if (myGamePiece.speedY > 1 || myGamePiece.speedX > 1) {
        var audio = new Audio('Explosion.mp3');
        xx.pause(); // Korjaa: Lisää sulut
        xx.currentTime = 0; // Nollaa audion alkuun
        audio.play();
        clearInterval(myGameArea.interval);
    

		}
		else {
			if (inLoading != 1 && myGamePiece.speedY > 0.2) {
			var audio = new Audio('LoadingPoint.mp3');
			
			audio.play();
			}
			inLoading = 1;

			myGamePiece.speedY = 0;
			myGamePiece.speedX = 0;

			if (objectCount < 1) {
			Map[endPositionY][endPositionX] = 4;
			}

		}

	}
	else {
		inLoading = 0;
	}




	//Collide
	//if ( Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 3) {

	function checkCollision() {

		if (inGroundElement == 1) { inGroundElement = 0; return; }
		let hitDetected = 0;


		//Right side
		if (Map[Math.floor(myGamePiece.y / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 3 && Map[Math.floor((myGamePiece.y + rocketWidth) / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 3) {
			myGamePiece.speedX = -myGamePiece.speedX
			hitDetected = 1;
		}
		//TopRight
		else if (Map[Math.floor(myGamePiece.y / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 3) {
			myGamePiece.speedX = -myGamePiece.speedX
			myGamePiece.speedY = -myGamePiece.speedY
			hitDetected = 1;
		}
		
		//BottomRight
		else if (Map[Math.floor((myGamePiece.y + rocketWidth) / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 3) {
			myGamePiece.speedX = -myGamePiece.speedX
			myGamePiece.speedY = -myGamePiece.speedY
			hitDetected = 1;
		}

		
		//Left side
		if (Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 3 && Map[Math.floor((myGamePiece.y + rocketWidth) / 14)][Math.floor(myGamePiece.x / 14)] == 3) {
			myGamePiece.speedX = -myGamePiece.speedX
			hitDetected = 1;
		}
		//TopLeft
		else if (Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 3) {
			myGamePiece.speedX = -myGamePiece.speedX
			myGamePiece.speedY = -myGamePiece.speedY
			hitDetected = 1;
		}

		//BottomLeft
		else if (Map[Math.floor((myGamePiece.y + rocketWidth) / 14)][Math.floor(myGamePiece.x / 14)] == 3) {
			myGamePiece.speedX = -myGamePiece.speedX
			myGamePiece.speedY = -myGamePiece.speedY
			hitDetected = 1;
		}

		

		//Bottom side
		if (Map[Math.floor((myGamePiece.y + rocketWidth) / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 3 && Map[Math.floor((myGamePiece.y + rocketWidth) / 14)][Math.floor(myGamePiece.x / 14)] == 3) {
			//myGamePiece.speedX = -myGamePiece.speedX
			myGamePiece.speedY = -myGamePiece.speedY / 1.5
			hitDetected = 1;
		}

		//Top side
		if (Map[Math.floor(myGamePiece.y / 14)][Math.floor((myGamePiece.x + rocketWidth) / 14)] == 3 && Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 3) {
			//myGamePiece.speedX = -myGamePiece.speedX
			myGamePiece.speedY = -myGamePiece.speedY
			hitDetected = 1;
		}

		if (hitDetected == 1){
			var audio = new Audio('Crash.mp3');
		    audio.play();
			inGroundElement = 1;
		}
	}

	checkCollision();

	
	//Object
	if ( Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 5) {
		Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] = 0;
		objectCount -= 1;

		var audio = new Audio('Object.mp3');
			audio.play();
		}
	
	//Finish level
	if ( Map[Math.floor(myGamePiece.y / 14)][Math.floor(myGamePiece.x / 14)] == 4) {
		var audio = new Audio('Stage completed.mp3');
		xx.pause;
		myAudio.src = myAudio.src;
		audio.play();
		
		clearInterval(myGameArea.interval);
		}

	document.onkeydown = checkKey;

function ReadFile1() {

	let input = document.querySelector('input');
	let textarea = document.querySelector('textarea');

	input.addEventListener('change', () => {
    let files = input.files;
 
    if(files.length == 0) return;
 
    const file = files[0];
 
    let reader = new FileReader();
 
    reader.onload = (e) => {
        const file = e.target.result;
        const lines = file.split(/\r\n|\n/);
        textarea.value = lines.join('\n');

    };

    reader.onerror = (e) => alert(e.target.error.name);
    reader.readAsText(file); 

	});

	}



	function checkKey(e) {

		e = e || window.event;

		if (e.keyCode == '87') { //38
			// up arrow
			
			moveup();
		}
		else if (e.keyCode == '83') { //40
			// down arrow
			movedown();
		}
		else if (e.keyCode == '65') { //37
		// left arrow
		moveleft();
		}
		else if (e.keyCode == '68') { //39
		// right arrow
		moveright();
		}
		else if (e.keyCode == '82') { //39
		// restart game
		clearInterval(myGameArea.interval);
		restart();
		}
		else if (e.keyCode == '81') { //mapfromfile
		ReadFile();
		}

		else if (e.keyCode == '77') { //39
		//music
		playAudio();

		}
	}

}

function moveup() {
    myGamePiece.speedY -= maxSpeed / 25; //0.2; 
}

function movedown() {
    myGamePiece.speedY += maxSpeed / 20;//0.5; 
}

function moveleft() {
    myGamePiece.speedX -= maxSpeed / 10;//0.5; 
}

function moveright() {
    myGamePiece.speedX += maxSpeed / 10;//0.5; 
}

	//myGamePiece.speedY = -5
